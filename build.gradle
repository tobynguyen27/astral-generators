plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
	id "org.jetbrains.kotlin.jvm" version "2.2.21"
    id "com.diffplug.spotless" version "8.1.0"
    id "idea"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.parchmentmc.org" } // Parchment
    maven { url = "https://maven.terraformersmc.com/" } // ModMenu
    maven { url = "https://mvn.devos.one/snapshots/" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url = "https://server.bbkr.space/artifactory/libs-release" }
    maven { url = "https://maven.shedaniel.me/" } // REU
    maven { url = "https://jitpack.io" } // CodeBebeLib
    maven { url = "https://api.modrinth.com/maven/" }
}

dependencies {
	minecraft("com.mojang:minecraft:${project.minecraft_version}")
	mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.18.2:2022.11.06@zip")
    }

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
	modImplementation("net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}")
    modImplementation("com.github.tobynguyen27:CodeBebeLib:${project.codebebelib}"){
        exclude group: "io.github.fabricators_of_create"
    }

    // API
    modImplementation("maven.modrinth:jade:${project.jade_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}")

    include modImplementation("io.github.fabricators_of_create:Porting-Lib:${project.porting_lib_version}")
    include modImplementation("me.alphamode:ForgeTags:${project.forge_tags_version}")
    include modImplementation("com.tterrag.registrate_fabric:Registrate:${project.registrate_version}") {
        exclude group: "io.github.fabricators_of_create"
    }
    include modImplementation("io.github.cottonmc:LibGui:${project.libgui_version}")
    include modImplementation("teamreborn:energy:${project.energy_api_version}")

    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude group: "net.fabricmc"
    }
    modLocalRuntime("maven.modrinth:jade-addons-fabric:${project.jade_addons_version}")
    modLocalRuntime("maven.modrinth:lazydfu:${project.lazydfu_version}")
    modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") {
        exclude group: "net.fabricmc"
    }
    modLocalRuntime("maven.modrinth:ctm-refabricated:${project.ctm_refabricated_version}")
    modLocalRuntime("maven.modrinth:powah:${project.powah_version}")
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        resources {
            srcDir("src/generated/resources")
            exclude(".cache")
        }
    }
}

loom {
    runs {
        register("datagen") {
            client()

            name("Data Generation")
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}")
            vmArg("-Dfabric-api.datagen.modid=${mod_id}")
            vmArg("-Dporting_lib.datagen.existing_resources=${file("src/main/resources")}")
        }

        getByName("server") { runDir("run/server") }

        getByName("client") {
            programArgs(["--username", "Toby"])
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
        minecraft_version      : minecraft_version,
        loader_version_range   : loader_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(["fabric.mod.json"]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

spotless {
    encoding "UTF-8"

    kotlin {
        ktfmt().kotlinlangStyle()
        endWithNewline()
        toggleOffOn()
    }

    java {
        importOrder()
        removeUnusedImports()
        palantirJavaFormat()
    }

    json {
        target("src/*/resources/**/*.json")
        targetExclude("src/generated/resources/**")

        biome("2.3.7").downloadDir(new File(rootDir, ".gradle/biome").absolutePath).configPath(new File(rootDir, "spotless/biome.json").absolutePath)

        endWithNewline()
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

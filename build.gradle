plugins {
	alias(libs.plugins.loom)
    alias(libs.plugins.kotlin)
	alias(libs.plugins.spotless)
	id "idea"
	id "maven-publish"
}

def ENV = System.getenv()
def runNumber = ENV.GITHUB_RUN_NUMBER == null ? "9999" : ENV.GITHUB_RUN_NUMBER
def isRelease = project.hasProperty("release")

version = isRelease ? "${project.mod_version}" : "${project.mod_version}-build.${runNumber}"
group = project.maven_group

base.archivesName = project.mod_id

repositories {
	maven { url = "https://maven.parchmentmc.org" } // Parchment
	maven { url = "https://maven.tobynguyen.dev/releases" } // CodeBebeLib, Sense
	maven { url = "https://maven.tobynguyen.dev/snapshots" }
	maven { url = "https://maven.terraformersmc.com/" } // ModMenu
	maven { url = "https://mvn.devos.one/snapshots/" }
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url = "https://server.bbkr.space/artifactory/libs-release" }
	maven { url = "https://maven.shedaniel.me/" } // REU
	maven { url = "https://jitpack.io" }
	maven { url = "https://api.modrinth.com/maven/" }
}

dependencies {
	minecraft(libs.minecraft)
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-1.18.2:2022.11.06@zip")
	}

	modImplementation(libs.fabric.loader)
    modImplementation(libs.fabric.api)
    modImplementation(libs.fabric.kotlin)

	modImplementation(libs.codebebelib){
		exclude group: "io.github.fabricators_of_create"
	}
	modImplementation(libs.sense)
	modImplementation(libs.modmenu) {
		exclude group: "net.fabricmc"
	}

	// API
	modCompileOnly(libs.rei.api)

    modImplementation(libs.portinglib)
    include (libs.portinglib)

    modImplementation(libs.forgetags)
    include(libs.forgetags)

    modImplementation(libs.registrate) {
		exclude group: "io.github.fabricators_of_create"
	}
    include(libs.registrate) {
        exclude group: "io.github.fabricators_of_create"
    }

	 modImplementation(libs.libgui)
    include (libs.libgui)

     modImplementation(libs.energyapi)
    include (libs.energyapi)

	modLocalRuntime(libs.jade)
    modLocalRuntime(libs.jadeaddons)
    modLocalRuntime(libs.lazydfu)
	modLocalRuntime(libs.rei.fabric) {
		exclude group: "net.fabricmc"
	}
}

sourceSets {
	main {
		resources {
			srcDir("src/generated/resources")
			exclude(".cache")
		}
	}
}

loom {
	runs {
		register("datagen") {
			client()

			name("Data Generation")
			vmArg("-Dfabric-api.datagen")
			vmArg("-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}")
			vmArg("-Dfabric-api.datagen.modid=${mod_id}")
			vmArg("-Dporting_lib.datagen.existing_resources=${file("src/main/resources")}")
		}

		getByName("server") { runDir("run/server") }

		getByName("client") {
			programArgs(["--username", "Toby"])
		}
	}
}

tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	var replaceProperties = [
		minecraft_version      : minecraft_version,
		loader_version_range   : loader_version,
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_version            : mod_version,
		mod_description        : mod_description
	]
	inputs.properties replaceProperties

	filesMatching(["fabric.mod.json"]) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}

	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

spotless {
	encoding "UTF-8"

	kotlin {
		ktfmt().kotlinlangStyle()
		endWithNewline()
		toggleOffOn()
	}

	groovyGradle {
		target "*.gradle"
		greclipse()
	}

	java {
		importOrder()
		removeUnusedImports()
		palantirJavaFormat()
	}

	json {
		target("src/*/resources/**/*.json")
		targetExclude("src/generated/resources/**")

		biome("2.3.7").downloadDir(new File(rootDir, ".gradle/biome").absolutePath).configPath(new File(rootDir, "spotless/biome.json").absolutePath)

		endWithNewline()
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

publishing {
	publications {
		maven(MavenPublication) {
			groupId = project.group
			artifactId = project.mod_id
			version = project.version

			from components.java
		}
	}

	repositories {
		if (isRelease) {
			maven {
				url "https://maven.tobynguyen.dev/releases"
				credentials {
					username ENV.MAVEN_USERNAME
					password ENV.MAVEN_PASSWORD
				}
			}
		} else {
			maven {
				url "https://maven.tobynguyen.dev/snapshots"
				credentials {
					username ENV.MAVEN_USERNAME
					password ENV.MAVEN_PASSWORD
				}
			}
		}
	}
}
